modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}"
license="MIT License"
[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
issueTrackerURL="https://discord.gg/ByxUBgPB"
displayName="${mod_name}" #mandatory
logoFile="examplemod.png" #optional
credits='''
    Some Textures mad by the author(s) of Necron's Pack Hypixel Skyblock
    most Textures made by Beefrient
    some Textures made by Jendrikose08
    heart of the nether texture made by Lenori
''' #optional
authors="Kapitencraft: Dev; Beefrient(, Lenori): Textures"
description='''
A very magical mod
'''
enumExtensions="META-INF/enumextensions.json"

[[mixins]]
config = "${mod_id}.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    mandatory=true #mandatory
    versionRange="${neo_version_range}" #mandatory
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${mc_version_range}"
    ordering="NONE"
    side="BOTH"